<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.10.0/p5.min.js"></script>
<script>
  /* global p5 */
  const sketch = (p) => {
    p.setup = () => {
      p.createCanvas(900, 900)
      p.background(259, 177, 140)
    }

    p.draw = () => {
      p.fill(120, 242, 173)
      p.quad(p.mouseX + 10, p.mouseY + 10, p.mouseX - 10, p.mouseY - 10, p.mouseX + 10, p.mouseY - 10, p.mouseX - 10, p.mouseY + 10, )
    }
  }
  new p5(sketch)
</script>
